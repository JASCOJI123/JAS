name: PC Optimizer — build, test, release

on:
  push:
    branches: ["**"]
    paths: ["pc-optimizer/**", ".github/workflows/pc-optimizer.yml"]
    tags: ["pc-optimizer-v*"]
  pull_request:
    paths: ["pc-optimizer/**"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: pc-optimizer

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore UltimatePcOptimizer.slnx

      - name: Build
        run: dotnet build UltimatePcOptimizer.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/UltimatePcOptimizer.Tests -c Release --no-build

      - name: Version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $v = if ($ref -like "pc-optimizer-v*") { $ref.Substring("pc-optimizer-v".Length) } else { "1.0.0-ci.${{ github.run_number }}" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Publish and build installer
        shell: pwsh
        run: ./scripts/publish.ps1 -Version "${{ steps.version.outputs.value }}" -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: UltimatePcOptimizer-${{ steps.version.outputs.value }}
          path: pc-optimizer/artifacts/installer/*.exe

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/pc-optimizer-v')
        uses: softprops/action-gh-release@v2
        with:
          files: pc-optimizer/artifacts/installer/*.exe
          generate_release_notes: true
